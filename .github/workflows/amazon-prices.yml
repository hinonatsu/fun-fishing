name: Update Amazon prices every morning

on:
  schedule:
    # 07:17 Asia/Tokyo (22:17 UTC on the preceding day).
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      diagnose:
        description: Inspect delivery settings without changing prices or deploying
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: amazon-price-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      ref: ${{ steps.commit.outputs.ref }}
      failed: ${{ steps.scrape.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fishing-hero
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Diagnose anonymous delivery settings
        if: ${{ inputs.diagnose }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { configureAmazonDelivery } from './scripts/amazon-delivery.mjs';
          import { mkdir, writeFile } from 'node:fs/promises';
          const browser = await chromium.launch({headless:true});
          try {
            const context = await browser.newContext({locale:'ja-JP',timezoneId:'Asia/Tokyo'});
            await context.route('**/*', route => ['image','media','font'].includes(route.request().resourceType()) ? route.abort() : route.continue());
            const page = await context.newPage();
            await page.goto('https://www.amazon.co.jp/dp/B0711KFYX7?th=1&psc=1', {waitUntil:'domcontentloaded',timeout:35000});
            const before = await page.locator('#nav-global-location-popover-link').allTextContents();
            const configured = await configureAmazonDelivery(page);
            const details = await page.evaluate(() => ({
              title:document.title,
              location:document.querySelector('#nav-global-location-popover-link')?.textContent,
              dialogs:[...document.querySelectorAll('[role="dialog"], [id^="a-popover-content"]')].map(n=>n.textContent.trim().slice(0,3000)),
              inputs:[...document.querySelectorAll('[id^="GLUX"]')].map(n=>({id:n.id,tag:n.tagName,text:n.textContent.trim().slice(0,200),visible:!!n.getClientRects().length})),
            }));
            const report = {before,configured,...details};
            console.log(JSON.stringify(report,null,2));
            await mkdir('artifacts/amazon-prices',{recursive:true});
            await writeFile('artifacts/amazon-prices/delivery-diagnostic.json',JSON.stringify(report,null,2));
          } finally { await browser.close(); }
          JS
      - name: Fetch all catalog prices
        if: ${{ !inputs.diagnose }}
        id: scrape
        # Publish successful prices and failure states before surfacing partial failures.
        run: npm run prices:update -- --allow-partial
      - name: Validate updated data and application
        if: ${{ !inputs.diagnose }}
        run: npm test && npm run build
      - name: Save snapshot
        if: ${{ !inputs.diagnose }}
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/amazon-prices.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update daily Amazon prices'
            git pull --rebase origin codex/fishing-hero
            git push origin HEAD:codex/fishing-hero
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Keep collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-price-report
          path: artifacts/amazon-prices/
          retention-days: 30

  deploy:
    needs: scrape
    if: ${{ !inputs.diagnose }}
    # GITHUB_TOKEN commits do not trigger a push workflow: deploy explicitly.
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.scrape.outputs.ref }}

  report-failures:
    needs: [scrape, deploy]
    if: ${{ !inputs.diagnose && always() && needs.scrape.result == 'success' && needs.scrape.outputs.failed != '0' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report incomplete price collection
        run: |
          echo 'Some Amazon prices could not be collected. Inspect the collection summary and amazon-price-report artifact.'
          exit 1
